[project]
name = "helio-agent"
version = "0.1.0"
description = "The AI Heliophysicist: deterministic heliophysics analysis tools for an LLM agent"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "astropy>=6.0",
    "sunpy[net,timeseries,visualization]>=6.0",
    "cdflib>=1.2",
    "cdasws>=1.8",
    "sscws>=2.3",
    "hapiclient>=0.2.5",
    "requests>=2.31",
    "fpdf2>=2.7",
    "xarray>=2024.1",
    "h5netcdf>=1.3",
    "defusedxml>=0.7",
    "pyspedas>=1.7",
    "plasmapy>=2024.2",
    "seaborn>=0.13",
    "geopack>=1.0.12",
]

[project.optional-dependencies]
extra = [
    "aiapy>=0.8",       # SDO/AIA calibration (degradation correction, PSF)
    "solarmach>=0.3",   # multi-spacecraft heliospheric configuration plots
    "pysat>=3.2",       # PyHC-core satellite data management framework
]

[project.scripts]
helio-agent = "helio_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helio_agent"]
